      // all time intervals are stored and measured in milliseconds
      function formatTime(ms) {
        const second = 1000;
        const minute = 60 * second;
        const hour = 60 * minute;

        const hours = Math.floor(ms / hour);
        ms -= hours * hour;
        const minutes = Math.floor(ms / minute);
        ms -= minutes * minute;
        const seconds = Math.floor(ms / second);
        ms -= seconds * second;

        return (
          (hours > 0 ? String(hours).padStart(2, "0") + ":" : "") +
          (String(minutes).padStart(2, "0") + ":") +
          String(seconds).padStart(2, "0")
        );
      }

  <body
    x-data="{
      shuffle: $store.cards.base
        .concat($store.cards.promo)
        .concat($store.cards.sensei)
        .filter((card) => card.enabled)
        .sort(() => 0.5 - Math.random()),
    }"
    class="bg-commie-beige font-yuji select-none"
  >
    <main
      x-data="{
        hasGameStarted: false,
        hasGameEnded: false,
        isGamePaused: false,
        isRedPlayerTurn: true,
        redPlayerTime: 15 * 60 * 1000,
        redPlayerTimeIncrement: 10 * 1000,
        bluePlayerTime: 15 * 60 * 1000,
        bluePlayerTimeIncrement: 10 * 1000,
        redPlayerLeftCard: shuffle[0],
        redPlayerRightCard: shuffle[1],
        centerCard: shuffle[2],
        bluePlayerLeftCard: shuffle[3],
        bluePlayerRightCard: shuffle[4],
        // responsible for triggering the first rotation of the center elements when blue player makes the first move
        didRedPlayerStartTheGame: true,
        // keep last move card in memory to enable undo
        lastMoveCard: undefined,
        // keep last move timestamp to enable timekeeping
        lastMoveTimestamp: undefined,
        redPlayerDisplayTime: undefined,
        bluePlayerDisplayTime: undefined,
        // undo will refund the time spent on the current turn to the opponent
        // while subtracting it from your time with additional penalty
        currentTurnDuration: 0,
        async move(card) {
          this.currentTurnDuration = 0;
          const timestamp = Date.now();
          await new Promise((r) => setTimeout(r, 100)); // wait for the animation
          if (this.hasGameStarted) {
            if (this.isRedPlayerTurn) {
              this.redPlayerTime -= timestamp - this.lastMoveTimestamp;
              if (this.lastMoveCard !== undefined) {
                this.redPlayerTime += this.redPlayerTimeIncrement;
              }
            } else {
              this.bluePlayerTime -= timestamp - this.lastMoveTimestamp;
              if (this.lastMoveCard !== undefined) {
                this.bluePlayerTime += this.bluePlayerTimeIncrement;
              }
            }
          }
          this.redPlayerDisplayTime = this.redPlayerTime;
          this.bluePlayerDisplayTime = this.bluePlayerTime;
          if (!this.hasGameStarted && ['bluePlayerLeftCard', 'bluePlayerRightCard'].includes(card)) {
            this.isRedPlayerTurn = false;
            this.didRedPlayerStartTheGame = false;
          }
          this.hasGameStarted = true;
          this[card] = [this.centerCard, this.centerCard = this[card]][0];
          this.isRedPlayerTurn = !this.isRedPlayerTurn;
          this.lastMoveTimestamp = timestamp;
          this.lastMoveCard = card;
        },
        async undo() {
          await new Promise((r) => setTimeout(r, 100)); // wait for the animation
          if (this.isRedPlayerTurn) {
            this.bluePlayerTime -= $store.undoPenaltyDuration;
            this.bluePlayerDisplayTime = this.bluePlayerTime - this.currentTurnDuration;
            this.redPlayerDisplayTime = this.redPlayerTime;
          } else {
            this.redPlayerTime = this.redPlayerTime - $store.undoPenaltyDuration;
            this.redPlayerDisplayTime = this.redPlayerTime - this.currentTurnDuration;
            this.bluePlayerDisplayTime = this.bluePlayerTime;
          }
          this[this.lastMoveCard] = [this.centerCard, this.centerCard = this[this.lastMoveCard]][0];
          this.isRedPlayerTurn = !this.isRedPlayerTurn;
          this.lastMoveCard = undefined;
        },
      }"
      x-init="setInterval(() => {
        if (!hasGameStarted || isGamePaused || hasGameEnded) return;
        currentTurnDuration += 1000;
        if (isRedPlayerTurn) {
          redPlayerDisplayTime = redPlayerTime - currentTurnDuration;
          if (redPlayerDisplayTime <= 0) {
            hasGameEnded = true;
          }
        } else {
          bluePlayerDisplayTime = bluePlayerTime - currentTurnDuration;
          if (bluePlayerDisplayTime <= 0) {
            hasGameEnded = true;
          }
        }
      }, 1000)"
      class="h-dvh flex flex-col justify-between sm:invisible"
    >
      <header class="flex justify-evenly mt-[4dvw] rotate-180">
        <button
          :disabled="(hasGameStarted && isRedPlayerTurn) || hasGameEnded"
          @click="move('bluePlayerLeftCard')"
          @pointerdown="timer = setTimeout(() => alert('Long press!'), 500)"
          @pointerup="clearTimeout(timer)"
          @pointercancel="clearTimeout(timer)"
          @pointerleave="clearTimeout(timer)"
          x-data="{ timer: null }"
          class="w-[43dvw] card-effects"
        >
          <img
            :src="bluePlayerLeftCard.image"
            draggable="false"
            class="pointer-events-none"
          />
        </button>
        <button
          :disabled="(hasGameStarted && isRedPlayerTurn) || hasGameEnded"
          @click="move('bluePlayerRightCard')"
          @pointerdown="timer = setTimeout(() => alert('Long press!'), 500)"
          @pointerup="clearTimeout(timer)"
          @pointercancel="clearTimeout(timer)"
          @pointerleave="clearTimeout(timer)"
          x-data="{ timer: null }"
          class="w-[43dvw] card-effects"
        >
          <img
            :src="bluePlayerRightCard.image"
            draggable="false"
            class="pointer-events-none"
          />
        </button>
      </header>
      <time
        x-text="formatTime(bluePlayerDisplayTime)"
        :class="hasGameStarted && !isRedPlayerTurn ? 'text-commie-red' : ''"
        class="text-center text-6xl rotate-180 transition duration-300"
      ></time>
      <article class="flex justify-between">
        <button
          :disabled="
            !$store.isUndoEnabled ||
            lastMoveCard === undefined ||
            (isRedPlayerTurn && bluePlayerTime < $store.undoPenaltyDuration + currentTurnDuration) ||
            (!isRedPlayerTurn && redPlayerTime < $store.undoPenaltyDuration + currentTurnDuration)
          "
          @click="undo"
        >
          UNDO
        </button>
        <button
          :disabled="hasGameStarted"
          @pointerdown="timer = setTimeout(() => alert('Long press!'), 500)"
          @pointerup="clearTimeout(timer)"
          @pointercancel="clearTimeout(timer)"
          @pointerleave="clearTimeout(timer)"
          x-data="{ timer: null }"
          :class="
            hasGameStarted ?
              isRedPlayerTurn ?
                didRedPlayerStartTheGame ? '' : 'rotate-360'
              : 'rotate-180'
            : 'card-effects'
          "
          class="w-[43dvw] transition"
        >
          <img
            :src="centerCard.image"
            draggable="false"
            class="pointer-events-none"
          />
        </button>
        <button disabled>ODNU</button>
      </article>
      <time
        x-text="formatTime(redPlayerDisplayTime)"
        :class="hasGameStarted && isRedPlayerTurn ? 'text-commie-red' : ''"
        class="text-center text-6xl transition duration-300"
      ></time>
      <footer class="flex justify-evenly mb-[4dvw]">
        <button
          :disabled="(hasGameStarted && !isRedPlayerTurn) || hasGameEnded"
          @click="move('redPlayerLeftCard')"
          @pointerdown="timer = setTimeout(() => alert('Long press!'), 500)"
          @pointerup="clearTimeout(timer)"
          @pointercancel="clearTimeout(timer)"
          @pointerleave="clearTimeout(timer)"
          x-data="{ timer: null }"
          class="w-[43dvw] card-effects"
        >
          <img
            :src="redPlayerLeftCard.image"
            draggable="false"
            class="pointer-events-none"
          />
        </button>
        <button
          :disabled="(hasGameStarted && !isRedPlayerTurn) || hasGameEnded"
          @click="move('redPlayerRightCard')"
          @pointerdown="timer = setTimeout(() => alert('Long press!'), 500)"
          @pointerup="clearTimeout(timer)"
          @pointercancel="clearTimeout(timer)"
          @pointerleave="clearTimeout(timer)"
          x-data="{ timer: null }"
          class="w-[43dvw] card-effects"
        >
          <img
            :src="redPlayerRightCard.image"
            draggable="false"
            class="pointer-events-none"
          />
        </button>
      </footer>
    </main>
